name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pull-request runs are cancelled; pushes to main are never
  # cancelled so every commit on main keeps a complete CI result.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Verify public source package
        run: npm run check:public-source

  layout-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Install the Electron binary for this platform
        run: node node_modules/electron/install.js
      - name: Configure the Linux sandbox helper
        run: |
          # Chromium requires its setuid sandbox helper to be owned by root with
          # mode 4755. GitHub's Linux runners ship the extracted Electron binary
          # without that ownership, so the browser aborts before the shell loads.
          # This changes only the runner's copy under node_modules; the shipped
          # app keeps its own hardened runtime and sandbox settings.
          sandbox=node_modules/electron/dist/chrome-sandbox
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          ls -l "$sandbox"
      - name: Run Electron layout smoke test
        run: xvfb-run --auto-servernum --server-args='-screen 0 1600x900x24' npm run test:layout-ui
